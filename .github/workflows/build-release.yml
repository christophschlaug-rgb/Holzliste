name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Abhaengigkeiten laden
        run: flutter pub get

      - name: Signatur-Schluessel aus Secrets wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            cat > android/keystore.properties <<EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          else
            echo "Kein Signatur-Schluessel hinterlegt - Anleitung siehe README.md"
            exit 1
          fi

      - name: Release-APK bauen
        run: |
          flutter build apk --release \
            --dart-define=ONEDRIVE_CLIENT_ID=${{ secrets.ONEDRIVE_CLIENT_ID }}

      - name: APK als Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: holzliste-app
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Holzliste-App Build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
